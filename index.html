<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{margin:0;font-family:Arial;background:#0A1628;color:white;padding:12px;padding-bottom:90px}.top{color:#00BFFF;font-size:26px;font-weight:bold;text-align:center}.card{background:#12233F;padding:16px;border-radius:15px;margin-top:12px;border:1px solid #1E3A5F}input{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #1E3A5F;background:#0A1628;color:white;box-sizing:border-box}.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:15px;margin-top:8px;cursor:pointer}.yellow{background:#FFD700;color:black}.green{background:#00C853;color:white}.blue{background:#00BFFF;color:white}.red{background:#FF5252;color:white}.gold{color:#FFD700}.small{color:#00BFFF;font-size:13px}.big{font-size:32px;text-align:center;color:#00BFFF;font-weight:bold}.center{text-align:center}.split{display:flex;gap:10px}.split div{flex:1;background:#0A1628;padding:10px;border-radius:10px;border:1px solid #1E3A5F}.stickyMine{position:fixed;bottom:0;left:0;right:0;background:#FFD700;color:black;padding:14px;text-align:center;font-weight:bold;font-size:18px;border:none;width:100%;cursor:pointer;z-index:999;display:none}</style></head><body>
<div class="top">💎 DASH DIAMOND</div>
<div class="center" style="font-size:20px;font-weight:bold;color:#FFD700;margin-top:8px">DASH IS.       </div>
<div class="card center"><div class="big">20,000,000</div><div class="split" style="margin-top:10px"><div><b style="color:#FFD700">10M DONATIONS</b><br><b id="donLeft">10,000,000</b></div><div><b style="color:#00BFFF">10M FOR MINE</b><br><b id="mineLeft">10,000,000</b></div></div><div style="margin-top:10px">Mined: <b id="poolMined" class="gold">0</b><br><span id="machineStatus" style="color:#FF5252;font-weight:bold">🔒 MINING NOW</span></div></div>
<div id="authBox" class="card"><h2 class="center gold">REGISTER / LOGIN</h2>
<input id="rName" placeholder="Full Name"><input id="rPhone" placeholder="Phone"><input id="rPass" type="password" placeholder="Password"><input id="rWallet" placeholder="Wallet Address"><input id="rDiamonds" type="number" placeholder="Starting Diamonds">
<button class="btn yellow" onclick="register()">REGISTER -     APPROVES INSTANTLY</button>
<button class="btn green" onclick="login()">LOGIN</button><p id="authMsg" class="center" style="color:#FFD700"></p></div>
<div id="dashBox" style="display:none">
<div class="card center"><h2>Welcome <span id="uName" class="gold"></span></h2><p><span id="uPhone"></span><br><span id="uWallet"></span></p><div class="big">💎 <span id="uDiamonds">0</span></div><p>Unlock: <b id="uUnlock" class="gold"></b><br><b id="uRemain" style="color:#00C853"></b></p><p id="withdrawMsg" class="center"></p></div>
<div class="card" style="border:2px solid #FFD700"><button class="btn yellow" style="font-size:20px;padding:18px" onclick="mine24()">⛏️ START MINING - +1 DIAMOND</button><p id="mineMsg" class="center gold"></p><p class="center small">Last Mine: <span id="lastMine">Never</span></p></div>
<div class="card"><input id="wAmount" type="number" placeholder="Amount to Withdraw"><button class="btn green" onclick="withdraw()">WITHDRAW</button><p id="wMsg" class="center gold"></p></div>
<div class="card"><button class="btn blue" onclick="trade('BUY')">BUY</button><button class="btn yellow" onclick="trade('SELL')">SELL</button></div>
<button class="btn red" onclick="logout()">LOGOUT</button></div>
<button id="stickyBtn" class="stickyMine" onclick="mine24()">⛏️ START MINING - TAP HERE - +1 DIAMOND</button>
<script>
const firebaseConfig={apiKey:"AIzaSyDT2742JibDhhDiHhJStSo63WRDLsfnhf4",authDomain:"dash-diamond.firebaseapp.com",databaseURL:"https://dash-diamond-default-rtdb.firebaseio.com",projectId:"dash-diamond",storageBucket:"dash-diamond.firebasestorage.app",messagingSenderId:"759296865870",appId:"1:759296865870:web:affc62e7d0227b16d5751f",measurementId:"G-W5BKCXJ318"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
const GLOBAL_UNLOCK=new Date('2029-10-30').getTime();
let currentPhone=null, currentUser=null;
function updateGlobalStatus(){let el=document.getElementById('machineStatus'); if(Date.now()>=GLOBAL_UNLOCK){el.innerText='✅ MINING STOPPED - TRANSACTION OPEN'; el.style.color='#00C853';} else {el.innerText='🔒 MINING NOW'; el.style.color='#FF5252';}} updateGlobalStatus();
async function register(){let name=document.getElementById('rName').value.trim(), phone=document.getElementById('rPhone').value.trim(), pass=document.getElementById('rPass').value.trim(), wallet=document.getElementById('rWallet').value.trim(), dia=parseFloat(document.getElementById('rDiamonds').value||0); if(!name||!phone||!pass){document.getElementById('authMsg').innerText='Fill Name, Phone, Password!';return;} let snap=await db.ref('users/'+phone).get(); if(snap.exists()){let u=snap.val(); if(u.password!==pass){document.getElementById('authMsg').innerText='Phone already exists! Press LOGIN - Wrong password!';return;} currentPhone=phone; currentUser=u; showDash(); return;} let join=Date.now(); let newUser={name,phone,password:pass,wallet,diamonds:dia,joinTime:join,unlockTime:GLOBAL_UNLOCK,status:'APPROVED',lastMine:0,totalMined:0}; await db.ref('users/'+phone).set(newUser); currentPhone=phone; currentUser=newUser; document.getElementById('authMsg').innerText='✅ MACHINE APPROVED YOU INSTANTLY! Start Mining!'; showDash();}
async function login(){let phone=document.getElementById('rPhone').value.trim(), pass=document.getElementById('rPass').value.trim(); let snap=await db.ref('users/'+phone).get(); if(!snap.exists()){document.getElementById('authMsg').innerText='No account. Register first.';return;} let u=snap.val(); if(u.password!==pass){document.getElementById('authMsg').innerText='Wrong password!';return;} currentPhone=phone; currentUser=u; showDash();}
function showDash(){document.getElementById('authBox').style.display='none'; document.getElementById('dashBox').style.display='block'; document.getElementById('stickyBtn').style.display='block'; document.getElementById('uName').innerText=currentUser.name; document.getElementById('uPhone').innerText=currentUser.phone; document.getElementById('uWallet').innerText=currentUser.wallet; document.getElementById('uDiamonds').innerText=currentUser.diamonds; let un=new Date(currentUser.unlockTime); document.getElementById('uUnlock').innerText=un.toDateString(); let remain=currentUser.unlockTime-Date.now(); let days=Math.ceil(remain/(1000*60*60*24)); document.getElementById('uRemain').innerText=days>0?days+' days left':'✅ TRANSACTION OPEN'; document.getElementById('lastMine').innerText=currentUser.lastMine?new Date(currentUser.lastMine).toLocaleString():'Never'; if(Date.now()>=currentUser.unlockTime){document.getElementById('withdrawMsg').innerText='✅ You can withdraw now!';} else{document.getElementById('withdrawMsg').innerText='🔒 Locked until 3 years.';} loadPool(); window.scrollTo(0,0);}
async function loadPool(){let s=await db.ref('users').get(); let total=0; if(s.exists()){Object.values(s.val()).forEach(u=>total+=parseFloat(u.diamonds||0));} document.getElementById('poolMined').innerText=total; document.getElementById('mineLeft').innerText=(10000000-total).toLocaleString(); document.getElementById('donLeft').innerText=(10000000).toLocaleString();}
async function mine24(){if(!currentPhone){alert('Please LOGIN first!');return;} if(Date.now()>=GLOBAL_UNLOCK){document.getElementById('mineMsg').innerText='⛔ MINING STOPPED';return;} let now=Date.now(); if(currentUser.lastMine && now-currentUser.lastMine < 24*60*60*1000){let msg='⏳ Wait 24HR. Come back in '+Math.ceil((24*60*60*1000-(now-currentUser.lastMine))/(1000*60*60))+' hours.'; document.getElementById('mineMsg').innerText=msg; alert(msg); return;} let newDia=parseFloat(currentUser.diamonds||0)+1; await db.ref('users/'+currentPhone).update({diamonds:newDia,lastMine:now,totalMined:(currentUser.totalMined||0)+1}); currentUser.diamonds=newDia; currentUser.lastMine=now; document.getElementById('uDiamonds').innerText=newDia; document.getElementById('mineMsg').innerText='✅ +1 SAVED! Total: '+newDia; alert('✅ +1 SAVED! Total: '+newDia); loadPool();}
async function withdraw(){let amt=parseFloat(document.getElementById('wAmount').value||0); if(Date.now()<currentUser.unlockTime || Date.now()<GLOBAL_UNLOCK){document.getElementById('wMsg').innerText='🔒 LOCKED! Wait until '+new Date(currentUser.unlockTime).toDateString();return;} if(amt<=0||amt>currentUser.diamonds){document.getElementById('wMsg').innerText='Invalid amount!';return;} let nd=currentUser.diamonds-amt; await db.ref('users/'+currentPhone).update({diamonds:nd}); await db.ref('trades').push({phone:currentPhone,type:'WITHDRAW',amount:amt,time:Date.now()}); currentUser.diamonds=nd; document.getElementById('uDiamonds').innerText=nd; document.getElementById('wMsg').innerText='✅ Withdraw '+amt+' SUCCESS!';}
async function trade(type){if(Date.now()<currentUser.unlockTime || Date.now()<GLOBAL_UNLOCK){alert('🔒 LOCKED until 3 years!');return;} await db.ref('trades').push({phone:currentPhone,type,amount:1,time:Date.now()}); alert(type+' recorded!');}
function logout(){location.reload();} loadPool();
</script></body></html>
