<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DASH Mining</title>
<style>
body { font-family: Arial; text-align: center; background: #0a0a0a; color: white; padding: 20px; }
.card { background: #1a1a1a; padding: 20px; border-radius: 15px; margin-top: 20px; }
.balance { font-size: 32px; color: #00ff88; font-weight: bold; }
.timer { font-size: 20px; margin: 15px 0; }
button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; }
.start { background: #00ff88; color: black; }
.claim { background: #ffaa00; color: black; }
button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<h2>DASH MINING</h2>

<div class="card">
  <div>Total Balance</div>
  <div class="balance" id="balance">0.000000 DASH</div>
  <div class="timer" id="timer">12:00:00 remaining</div>
  <div>Mined this session: <span id="mined">0.000000</span> DASH</div>
  <button class="start" id="startBtn" onclick="startMining()">START MINING</button>
  <button class="claim" id="claimBtn" onclick="claimReward()" style="display:none;">CLAIM REWARD</button>
</div>

<script>
const MINING_DURATION = 12 * 60 * 60 * 1000; // 12 hours
const RATE_PER_SECOND = 0.00001; // Change this rate if you want

function getBalance() {
  return parseFloat(localStorage.getItem('dash_balance') || '0');
}
function setBalance(v) {
  localStorage.setItem('dash_balance', v.toString());
}

function startMining() {
  if (localStorage.getItem('mining_start')) return;
  localStorage.setItem('mining_start', Date.now().toString());
  updateDisplay();
}

function claimReward() {
  const start = parseInt(localStorage.getItem('mining_start'));
  if (!start) return;
  const elapsed = Date.now() - start;
  const mined = Math.min(elapsed / 1000, MINING_DURATION / 1000) * RATE_PER_SECOND;
  setBalance(getBalance() + mined);
  localStorage.removeItem('mining_start');
  updateDisplay();
  alert('Claimed ' + mined.toFixed(6) + ' DASH');
}

function updateDisplay() {
  const start = localStorage.getItem('mining_start');
  const balanceEl = document.getElementById('balance');
  const minedEl = document.getElementById('mined');
  const timerEl = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const claimBtn = document.getElementById('claimBtn');

  balanceEl.textContent = getBalance().toFixed(6) + ' DASH';

  if (!start) {
    minedEl.textContent = '0.000000';
    timerEl.textContent = '12:00:00 remaining';
    startBtn.style.display = 'block';
    startBtn.disabled = false;
    startBtn.textContent = 'START MINING';
    claimBtn.style.display = 'none';
    return;
  }

  const elapsed = Date.now() - parseInt(start);
  const remaining = MINING_DURATION - elapsed;

  if (remaining <= 0) {
    const mined = (MINING_DURATION / 1000) * RATE_PER_SECOND;
    minedEl.textContent = mined.toFixed(6);
    timerEl.textContent = 'Session Complete';
    startBtn.style.display = 'none';
    claimBtn.style.display = 'block';
    return;
  }

  const mined = (elapsed / 1000) * RATE_PER_SECOND;
  minedEl.textContent = mined.toFixed(6);

  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  timerEl.textContent = h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ' remaining';

  startBtn.style.display = 'block';
  startBtn.disabled = true;
  startBtn.textContent = 'MINING...';
  claimBtn.style.display = 'none';
}
<div id="walletBalance">0.000000 DASH</div>

<script>
  const balance = parseFloat(localStorage.getItem('dash_balance') || '0');
  document.getElementById('walletBalance').textContent = balance.toFixed(6) + ' DASH';
</script>
setInterval(updateDisplay, 1000);
updateDisplay();
</script>
</body>
</html>
