<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0A1628;color:white;padding:15px}
.top{color:#FFD700;font-size:24px;font-weight:bold;text-align:center}
.card{background:#12233F;padding:18px;border-radius:15px;margin-top:15px;border:1px solid #1E3A5F}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #1E3A5F;border-radius:10px;background:#0A1628;color:white;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
.yellow{background:#FFD700;color:black}.red{background:#FF5252;color:white}.green{background:#00C853;color:white}
.user{background:#0A1628;padding:12px;border-radius:10px;margin:10px 0;border:1px solid #1E3A5F}
.small{color:#00BFFF;font-size:13px}
</style></head><body>
<div class="top">👑 DASH DIAMOND - OWNER ADMIN</div>
<div id="loginBox" class="card">
<h2 style="text-align:center">OWNER LOGIN</h2>
<input id="adminPass" type="password" placeholder="Enter Owner Password">
<button class="btn yellow" onclick="adminLogin()">LOGIN AS OWNER</button>
<p style="text-align:center;color:#FFD700">Password: DASH2026</p>
<p id="msg" style="text-align:center;color:red"></p>
</div>
<div id="adminBox" style="display:none">
<div class="card">
<h2 style="text-align:center;color:#FFD700">ALL USERS</h2>
<p style="text-align:center">Total Users: <b id="totalUsers" style="color:#00BFFF">0</b> | Total Diamonds: <b id="totalDiamonds" style="color:#FFD700">0</b></p>
<button class="btn green" onclick="loadUsers()">🔄 REFRESH USERS</button>
<div id="usersList"></div>
</div>
<div class="card">
<h2 style="text-align:center;color:#00BFFF">ALL TRADES</h2>
<div id="tradesList"></div>
<button class="btn yellow" onclick="loadTrades()">🔄 REFRESH TRADES</button>
</div>
<button class="btn red" onclick="logout()">LOGOUT</button>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDT2742JibDhhDiHhJStSo63WRDLsfnhf4",
  authDomain: "dash-diamond.firebaseapp.com",
  databaseURL: "https://dash-diamond-default-rtdb.firebaseio.com",
  projectId: "dash-diamond",
  storageBucket: "dash-diamond.firebasestorage.app",
  messagingSenderId: "759296865870",
  appId: "1:759296865870:web:affc62e7d0227b16d5751f",
  measurementId: "G-W5BKCXJ318"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
function adminLogin(){
let p=document.getElementById('adminPass').value;
if(p==="DASH2026"){
document.getElementById('loginBox').style.display='none';
document.getElementById('adminBox').style.display='block';
loadUsers(); loadTrades();
}else{document.getElementById('msg').innerText='Wrong Owner Password!';}
}
async function loadUsers(){
let snap=await db.ref('users').get();
let list=document.getElementById('usersList'); list.innerHTML='';
if(!snap.exists()){list.innerHTML='<p>No users yet</p>'; return;}
let users=snap.val(); let count=0; let totalD=0;
for(let phone in users){
let u=users[phone]; count++; totalD+=parseFloat(u.diamonds||0);
let join=new Date(u.joinTime||Date.now()); let unlock=new Date(u.joinTime||Date.now()); unlock.setFullYear(unlock.getFullYear()+3);
list.innerHTML+=`<div class="user"><b style="color:#FFD700">${u.name||''}</b><br><span class="small">Phone: ${u.phone||phone}<br>Wallet: ${u.wallet||''}<br>Diamonds: <b style="color:#FFD700">${u.diamonds||0}</b><br>Joined: ${join.toDateString()}<br>Unlocks: ${unlock.toDateString()}<br>Status: ${u.status||'PENDING'}</span><br><br><button style="padding:8px 12px;background:#00C853;border:none;border-radius:8px;font-weight:bold" onclick="approveUser('${phone}')">✅ APPROVE</button> <button style="padding:8px 12px;background:#FF5252;color:white;border:none;border-radius:8px;font-weight:bold" onclick="deleteUser('${phone}')">❌ DELETE</button></div>`;
}
document.getElementById('totalUsers').innerText=count;
document.getElementById('totalDiamonds').innerText=totalD;
}
async function approveUser(phone){ await db.ref('users/'+phone+'/status').set('APPROVED'); alert('Approved '+phone); loadUsers(); }
async function deleteUser(phone){ if(confirm('Delete '+phone+' ?')){ await db.ref('users/'+phone).remove(); alert('Deleted'); loadUsers(); } }
async function loadTrades(){
let snap=await db.ref('trades').get();
let list=document.getElementById('tradesList'); list.innerHTML='';
if(!snap.exists()){list.innerHTML='<p>No trades yet</p>'; return;}
let trades=snap.val();
for(let id in trades){ let t=trades[id]; list.innerHTML+=`<div class="user">${t.phone} - <b>${t.type}</b> - Amount: ${t.amount} - ${new Date(t.time).toLocaleString()}</div>`; }
}
function logout(){document.getElementById('adminBox').style.display='none';document.getElementById('loginBox').style.display='block';}
</script></body></html>
