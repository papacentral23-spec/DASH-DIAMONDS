<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#0A1628;color:white;padding:15px}
.top{color:#00BFFF;font-size:24px;font-weight:bold}
.card{background:#12233F;padding:18px;border-radius:15px;margin-top:15px;border:1px solid #1E3A5F}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #1E3A5F;border-radius:10px;background:#0A1628;color:white;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
.yellow{background:#FFD700;color:black}.bluebtn{background:#00BFFF;color:white}
.big{font-size:42px;color:#00BFFF;font-weight:bold;text-align:center}
.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.error{background:#FF1744;color:white;padding:12px;border-radius:10px;text-align:center;font-weight:bold;display:none}
.ok{background:#00C853;color:white;padding:12px;border-radius:10px;text-align:center;font-weight:bold;display:none}
</style></head><body>
<div class="top">💎 DASH DIAMOND</div>

<!-- PAGE 1 - REGISTRATION -->
<div id="page-reg">
<div class="card">
<h2 style="text-align:center;color:#00BFFF">CREATE ACCOUNT</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="pass" type="password" placeholder="Password">
<input id="wallet" placeholder="Wallet Address">
<input id="diamonds" type="number" placeholder="How many Diamonds do you have?">
<button class="btn yellow" onclick="register()">REGISTER NOW</button>
<p style="text-align:center;color:#00BFFF" onclick="login()">Already have account? Login</p>
<p id="msg" style="text-align:center;color:#FFD700"></p>
</div>
</div>

<!-- PAGE 2 - P2P + MATHOSIA 3 YEARS -->
<div id="page-p2p" style="display:none">
<div class="card">
<h2 style="text-align:center;color:#00BFFF">P2P MARKET</h2>
<div class="big" id="dBal">0</div><p style="text-align:center">Your Diamonds</p>
<p style="text-align:center">Joined: <b id="joinDate"></b><br>Trade Unlocks: <b id="unlockDate" style="color:#FFD700"></b><br>Time Left: <b id="timeLeft" style="color:#00BFFF"></b></p>
<div class="big" style="font-size:24px">10M</div><p style="text-align:center">Global Pool</p>

<div id="errBox" class="error"></div>
<div id="okBox" class="ok">✅ MATHOSIA APPROVED<br>3 Years Completed + Diamonds Found<br>You Can Trade Now</div>

<div class="row"><button id="buyBtn" style="background:#00FF88" onclick="doTrade('BUY')">BUY</button><button id="sellBtn" style="background:#FF5252;color:white" onclick="doTrade('SELL')">SELL</button></div>
<input id="amt" placeholder="Amount">
<button id="confirmBtn" class="btn bluebtn" onclick="doTrade('CONFIRM')">CONFIRM TRADE</button>
<button class="btn yellow" onclick="logout()">LOGOUT</button>
</div>
</div>

<script>
let diamonds=0, joinTime=0;
function register(){
 let n=document.getElementById('name').value, p=document.getElementById('phone').value, pw=document.getElementById('pass').value, w=document.getElementById('wallet').value;
 diamonds=parseFloat(document.getElementById('diamonds').value||0);
 if(!n||!p||!pw){document.getElementById('msg').innerText='Please fill Name, Phone, Password!';return;}
 joinTime=Date.now();
 localStorage.setItem('dash_user', JSON.stringify({name:n,phone:p,pass:pw,wallet:w,diamonds:diamonds,joinTime:joinTime}));
 document.getElementById('msg').innerText='Account Created! Welcome '+n+' - 3 Years Lock Started!';
 setTimeout(showP2P,800);
}
function login(){
 let p=prompt('Enter Phone:'); let pw=prompt('Enter Password:');
 let u=JSON.parse(localStorage.getItem('dash_user')||'null');
 if(u && u.phone==p && u.pass==pw){diamonds=u.diamonds||0; joinTime=u.joinTime||Date.now(); showP2P();} else {alert('Wrong Phone or Password. Please Register first.');}
}
function showP2P(){
 document.getElementById('page-reg').style.display='none';document.getElementById('page-p2p').style.display='block';
 document.getElementById('dBal').innerText=diamonds;
 let join=new Date(joinTime); let unlock=new Date(joinTime); unlock.setFullYear(unlock.getFullYear()+3);
 document.getElementById('joinDate').innerText=join.toDateString();
 document.getElementById('unlockDate').innerText=unlock.toDateString();
 let now=Date.now(); let diff=unlock-now; let yearsLeft=(diff/(1000*60*60*24*365)).toFixed(2);
 let canTrade = (diamonds>0 && now>=unlock.getTime());
 document.getElementById('timeLeft').innerText = now>=unlock.getTime() ? '0 - UNLOCKED' : yearsLeft+' years left';
 if(!canTrade){
   let reason = diamonds<=0 ? '⛔ ERROR - MATHOSIA METHOD<br>No Diamonds Found!' : '⛔ ERROR - MATHOSIA METHOD<br>3 Years Not Completed!<br>You Cannot Trade Until '+unlock.toDateString();
   document.getElementById('errBox').innerHTML=reason;
   document.getElementById('errBox').style.display='block'; document.getElementById('okBox').style.display='none';
   document.getElementById('buyBtn').disabled=true;document.getElementById('sellBtn').disabled=true;document.getElementById('confirmBtn').disabled=true;
   document.getElementById('buyBtn').style.opacity='0.3';document.getElementById('sellBtn').style.opacity='0.3';document.getElementById('confirmBtn').style.opacity='0.3';
 } else {
   document.getElementById('errBox').style.display='none'; document.getElementById('okBox').style.display='block';
   document.getElementById('buyBtn').disabled=false;document.getElementById('sellBtn').disabled=false;document.getElementById('confirmBtn').disabled=false;
   document.getElementById('buyBtn').style.opacity='1';document.getElementById('sellBtn').style.opacity='1';document.getElementById('confirmBtn').style.opacity='1';
 }
}
function doTrade(t){
 let unlock=new Date(joinTime); unlock.setFullYear(unlock.getFullYear()+3);
 if(diamonds<=0){alert('⛔ ERROR - MATHOSIA: No Diamonds!');return;}
 if(Date.now()<unlock.getTime()){alert('⛔ ERROR - MATHOSIA: Cannot Trade Until 3 Years! Unlocks: '+unlock.toDateString());return;}
 alert(t+' Trade Confirmed! Mathosia Approved.');
}
function logout(){document.getElementById('page-reg').style.display='block';document.getElementById('page-p2p').style.display='none';}
</script></body></html>
